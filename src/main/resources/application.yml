spring:
  application:
    name: BusTime_backend
  config:
    import: optional:file:.env[.properties]

  cache:
    type: redis
  data:
    redis:
      host: ${spring.data.redis.host:127.0.0.1}
      port: ${spring.data.redis.port:6379}
      database: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

public-api:
  service-key: ${public-api.service-key}

bus:
  scheduler:
    # 배포 후 Render 환경변수 BUS_SCHEDULER_ENABLED=true 로 켠다 (실행 중에 확인하므로 재배포 불필요)
    enabled: false
    tick: PT5S              # 조회할 차례인 정류장을 고르는 주기
    initial-delay: PT30S
    poll-interval: 60s      # 정류장별 조회 주기 (측정한 갱신 간격 중앙값 122초의 절반)
    max-calls-per-tick: 6   # 64개를 60초 안에 돌려면 tick(5초)당 6개
    zone: Asia/Seoul
    active-from: "06:00"
    active-to: "23:00"
    daily-call-limit: 400000  # 한도 50만 회의 80%
    arrival-station-count: 2  # 이 정류장 수 이하에서 사라지면 도착으로 판단
    cache-ttl: 300s
  stops:
    - { name: "창 원 T/R", node-id: TSB390000116 }
